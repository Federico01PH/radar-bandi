name: Raccolta bandi

on:
  schedule:
    # GitHub lavora in UTC e ignora l'ora legale. Due orari coprono entrambi
    # i regimi; la seconda esecuzione si ferma da sola se la prima e' riuscita.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      prova_notifiche:
        description: "Manda anche un avviso di prova sui telefoni iscritti"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Mai due raccolte insieme: si contenderebbero il push dei dati.
concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    env:
      # Indirizzo pubblico della piattaforma: e' quello che finisce nelle notifiche.
      SITO_URL: https://bandi-sefinisseroleparole.vercel.app/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # 90 minuti bastano a separare le due esecuzioni del mattino. Una finestra
      # piu' lunga farebbe saltare la raccolta del giorno dopo a ogni avvio serale.
      - name: Salta se ha gia' girato nell'ultima ora e mezza
        id: guardia
        run: |
          # Solo le esecuzioni pianificate si saltano: un avvio a mano parte sempre.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "salta=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ultimo=$(git log -1 --format=%ct -- data/meta.json)
          ultimo=${ultimo:-0}
          adesso=$(date +%s)
          if [ $((adesso - ultimo)) -lt 5400 ]; then
            echo "salta=si" >> "$GITHUB_OUTPUT"
            echo "Gia' eseguita meno di 90 minuti fa, si salta."
          else
            echo "salta=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Raccolta
        id: raccolta
        if: steps.guardia.outputs.salta == 'no'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINATARI: ${{ secrets.EMAIL_DESTINATARI }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROVA_NOTIFICHE: ${{ inputs.prova_notifiche }}
        run: npm run raccolta

      # Senza email configurata la raccolta lascia qui le segnalazioni: aperte
      # come issue, GitHub le manda per email al proprietario del repository.
      - name: Apri le segnalazioni su GitHub
        if: always() && steps.guardia.outputs.salta == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sito="$SITO_URL"
          for tipo in allarme bandi; do
            if [ -f "notifiche/$tipo.md" ]; then
              printf '\nTutti i bandi, con i filtri: %s\n\ncc @%s\n' "$sito" "${{ github.repository_owner }}" >> "notifiche/$tipo.md"
              gh issue create --title "$(cat "notifiche/$tipo.titolo")" --body-file "notifiche/$tipo.md"
            fi
          done

      # Gira anche se la raccolta segnala un errore di notifica: i dati sono
      # gia' scritti e perderli costerebbe lo storico di salute delle fonti.
      - name: Salva i risultati
        if: always() && steps.guardia.outputs.salta == 'no'
        run: |
          git config user.name "Radar Bandi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna modifica da registrare."
          else
            git commit -m "Raccolta del $(date +%Y-%m-%d)"
            # Se nel frattempo qualcuno ha modificato il ramo, ci si riallinea e si riprova.
            git push || (git pull --rebase && git push)
          fi
